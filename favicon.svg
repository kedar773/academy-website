<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191922" />
      <stop offset="50%" stop-color="#101015" />
      <stop offset="100%" stop-color="#08080A" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(242, 166, 35, 0.9)" />
      <stop offset="40%" stop-color="rgba(255, 94, 30, 0.6)" />
      <stop offset="100%" stop-color="rgba(242, 166, 35, 0.25)" />
    </linearGradient>

    <!-- Golden Brand Gradient for K -->
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#FFC533" />
      <stop offset="65%" stop-color="#F2A623" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Tab Depth -->
    <filter id="kShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#F2A623" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- High-Contrast Squircle Badge -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="124"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="16"
  />

  <!-- Subtle Radial Core Glow -->
  <circle cx="256" cy="256" r="160" fill="#F2A623" opacity="0.09" />

  <!-- Bold, Recognizable Monumental "K" -->
  <path
    d="M 116 126
       C 116 109 129 96 146 96
       L 204 96
       L 204 224
       L 308 96
       L 384 96
       C 400 96 412 108 412 124
       C 412 133 408 141 401 148
       L 286 256
       L 401 364
       C 408 371 412 379 412 388
       C 412 404 400 416 384 416
       L 308 416
       L 204 288
       L 204 416
       L 146 416
       C 129 416 116 403 116 386
       Z"
    fill="url(#kGrad)"
    filter="url(#kShadow)"
  />
</svg>